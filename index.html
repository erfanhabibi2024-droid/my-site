<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پورتفولیو عرفان حبیبی</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- دکمه حالت شب/روز لوکس -->
    <button id="theme-btn">🌙 حالت شب</button>

    <div class="container">
        <!-- بخش بالایی کارت -->
        <header class="profile-card">
            <div class="img-glow">
                <img src="me.jpg" alt="عرفان حبیبی">
            </div>
            <h1>عرفان حبیبی</h1>
            <p class="badge">توسعه‌دهنده وب</p>
        </header>

        <!-- بخش مشخصات دکوراتیو -->
        <section class="info-section">
            <h2>📋 مشخصات من</h2>
            <ul>
                <li>
                    <strong>📍 محل سکونت:</strong>
                    <span>Germany</span>
                </li>
                <li>
                    <strong>📧 ایمیل:</strong>
                    <span>erfanhabibi2024@gmail.com</span>
                </li>
                <li>
                    <strong>🚀 تخصص:</strong>
                    <span>HTML / CSS / JS</span>
                </li>
            </ul>
        </section>

        <!-- بخش شبکه‌های اجتماعی نمایشی و شیک -->
                 <footer class="social-links">
            <a href="https://instagram.com/erfan747529" target="_blank" class="social-icon">Instagram</a>
            <a href="tg://resolve?domain=2017Ronaldo" class="social-icon">Telegram</a>
            <a href="https://wa.me" target="_blank" class="social-icon">WhatsApp</a>
            <a href="mailto:erfanhabibi2024@gmail.com" class="social-icon">Email</a>
        </footer>

    </div>

    <!-- کدهای جادویی جاوااسکریپت مستقیم داخل خود HTML برای کارکرد ۱۰۰٪ تضمینی -->
    <script>
        const themeBtn = document.getElementById('theme-btn');

        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            
            if (document.body.classList.contains('dark-mode')) {
                themeBtn.textContent = '☀️ حالت روز';
                themeBtn.style.background = 'linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%)';
                themeBtn.style.color = '#333';
            } else {
                themeBtn.textContent = '🌙 حالت شب';
                themeBtn.style.background = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
                themeBtn.style.color = 'white';
            }
        });
    </script>
</body>
</html>
